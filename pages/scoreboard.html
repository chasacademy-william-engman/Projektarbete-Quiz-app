<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Test your knowledge with Team 5 Quiz App. Play quizzes across categories and difficulty levels, check the scoreboard, or replay past quizzes."
    />

    <link rel="stylesheet" href="../style/base.css" />
    <link rel="stylesheet" href="../style/style-scoreboard.css" />
    <!-- FONTAWSOME ICONS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="../script/data.js" defer></script>
    <title>Scoreboard</title>
  </head>
  <body>
    <header class="page-bar">
      <nav class="quiz-nav">
        <a
          href="../index.html"
          class="page-bar__back"
          aria-label="Back to dashboard"
        >
          <span aria-hidden="true"
            ><i class="fa-solid fa-arrow-left-long"></i
          ></span>
        </a>
        <span>Back to dashboard</span>
      </nav>
    </header>

    <main>
      <h1>Leaderboard</h1>
      <section class="scoreboard" aria-label="Scoreboard">
        <ol id="leaderboard-list">
          <li class="quiz-card">
            <span class="order">1. </span>
            <span class="name">Rolf</span>
            <span class="quiz-score">700</span>
          </li>
          <li class="quiz-card">…</li>
          <li class="quiz-card">…</li>
          <li class="quiz-card">…</li>
        </ol>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="script/api.js" defer></script>
    <link rel="stylesheet" href="/style/base.css" />
    <link rel="stylesheet" href="/style/style-result.css" />
    <!-- FONTAWSOME ICONS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Result</title>
  </head>
  <body>
    <header class="page-bar">
      <a
        href="../index.html"
        class="page-bar__back"
        aria-label="Back to dashboard"
      >
        <span aria-hidden="true"
          ><i class="fa-solid fa-arrow-left-long"></i
        ></span>
      </a>
    </header>

    <main>
      <section class="quiz-card text-center" aria-labelledby="result-title">
        <p class="quiz-meta">
          <span>
            <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
            <span id="quiz-category">History</span>
          </span>
          <span>
            <i class="fa-regular fa-face-laugh-beam" aria-hidden="true"></i>
            <span id="quiz-difficulty">Medium</span>
          </span>
        </p>

        <h1 id="result-title">Your score:</h1>
        <p class="quiz-score user-score" id="quiz-score">208208</p>

        <button id="play-again" class="boton-elegante">
          <i class="fa-solid fa-play" aria-hidden="true"></i> Play again
        </button>
      </section>

      <section class="scoreboard">
        <h2>Leaderboard</h2>
        <ol>
          <li class="quiz-card">
            <span class="order">1.</span>
            <span class="name">Rolf</span> –
            <span class="quiz-score">700</span>
          </li>
          <li class="quiz-card">…</li>
          <li class="quiz-card">…</li>
          <li class="quiz-card">…</li>
        </ol>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="script/api.js" defer></script>
    <link rel="stylesheet" href="/style/base.css" />
    <link rel="stylesheet" href="/style/style-quiz-game.css" />
    <!-- FONTAWSOME ICONS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Quiz</title>
  </head>
  <body>
    <header class="page-bar">
      <button class="boton-elegante">Exit Quiz</button>
      <div class="timer-container" role="timer" aria-label="Time remaining">
        <i class="fa-regular fa-clock" aria-hidden="true"></i>
        <time class="timer" datetime="PT1M">1:00</time>
      </div>
    </header>

    <main class="quiz-container">
      <div
        class="quiz-progress"
        role="progressbar"
        aria-label="Quiz progress"
        aria-valuemin="0"
        aria-valuemax="20"
        aria-valuenow="10"
      >
        <div class="quiz-progress__bar" style="width: 50%"></div>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Test your knowledge with Team 5 Quiz App. Play quizzes across categories and difficulty levels, check the scoreboard, or replay past quizzes."
    />

    <link rel="stylesheet" href="/style/base.css" />
    <link rel="stylesheet" href="/style/style-quiz-game.css" />
    <!-- FONTAWSOME ICONS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script type="module" src="../script/quiz-game.js"></script>
    <title>Quiz</title>
  </head>
  <body>
    <header class="page-bar">
      <nav id="quiz-nav" class="quiz-nav">
        <button
          id="exit-quiz"
          class="boton-elegante boton-elegante--light"
          type="button"
        >
          Exit Quiz
        </button>

        <div class="timer-container" role="timer" aria-label="Time remaining">
          <i class="fa-regular fa-clock" aria-hidden="true"></i>
          <time class="timer" datetime="PT1M">1:00</time>
        </div>
      </nav>
    </header>

    <main class="quiz-container">
      <div
        class="quiz-progress"
        role="progressbar"
        aria-label="Quiz progress"
        aria-valuemin="0"
        aria-valuemax="20"
        aria-valuenow="10"
      >
        <div class="quiz-progress__bar" style="width: 0%"></div>
      </div>

      <section class="quiz-card">
        <div class="question-banner">
          <img
            src="https://images.squarespace-cdn.com/content/v1/5fc5c5ec9698b02c7f421436/1606972673927-WR4Q5A79T2BOH81HOKTS/WWTBAM_TitleScreen+copy.png"
            alt=""
          />
          <h1 class="quiz-question" id="question">
            What is the capital of Sweden?
          </h1>
        </div>

        <div class="quiz-options" role="group" aria-labelledby="question">
          <button class="quiz-option" type="button" disabled>Gothenburg</button>
          <button class="quiz-option correct" type="button" disabled>
            Stockholm
          </button>
          <button class="quiz-option incorrect" type="button" disabled>
            Malmö
          </button>
          <button class="quiz-option selected" type="button">Uppsala</button>
        </div>
      </section>
    </main>

    <div
      id="error-modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      hidden
    >
      <div class="modal-backdrop" data-close></div>
      <div class="modal-content">
        <h2 id="modal-title">Are you sure?</h2>
        <p>This will quit your current quiz.</p>
        <p class="modal-hint">Current score will be deleted</p>
        <button type="button" class="modal-btn" data-confirm>OK</button>
        <button type="button" class="modal-btn modal-btn2" data-cancel>
          Cancel
        </button>
      </div>
    </div>
  </body>
</html>

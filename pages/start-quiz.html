<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/style/base.css" />
    <link rel="stylesheet" href="/style/style-start-quiz.css" />

    <!-- FONTAWSOME ICONS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Start Quiz</title>
  </head>
  <body>
    <header class="page-bar">
      <a href="./categories.html" class="page-bar__back" aria-label="Tillbaka">
        <span aria-hidden="true"
          ><i class="fa-solid fa-arrow-left-long"></i
        ></span>
      </a>
      <h1 class="page-bar__title">Start Quiz</h1>
    </header>

    <section id="hero">
      <!-- placeholder image -->
      <img
        width="100%"
        height="280"
        style="
          border-radius: 30px 30px 0 0;
          background:
            linear-gradient(45deg, #a361f4, transparent),
            linear-gradient(-45deg, #519ae7, transparent),
            linear-gradient(90deg, #7daeb1, transparent),
            linear-gradient(0deg, #7028d6, #023047);
        "
      />

      <div class="card-title">
        <h1>Bananas</h1>
        <p>Take this quiz about bananas</p>
        <span><i class="fa-regular fa-face-smile"></i>Difficulty - Easy</span>
      </div>
    </section>

    <section id="quiz-title">
      <h2>Title</h2>
      <p>description</p>
      <a href="" class="boton-elegante">
        <i class="fa-solid fa-play"></i> Start
      </a>
    </section>

    <section id="quiz-start-container">
      <button class="quiz-start-card">
        <!-- placeholder image -->
        <img
          width="80"
          height="80"
          style="
            border-radius: 12px;
            background:
              linear-gradient(45deg, #a361f4, transparent),
              linear-gradient(-45deg, #519ae7, transparent),
              linear-gradient(90deg, #7daeb1, transparent),
              linear-gradient(0deg, #7028d6, #023047);
          "
        />
        <div class="quiz-card-desc">
          <p class="quiz-card-desc-title">Pineapple</p>
          <div>
            <p><span>Fruits</span> • <span>Hard</span></p>
            <p>Take this quiz about pineapples</p>
          </div>
        </div>
      </button>
      <button class="quiz-start-card">
        <!-- placeholder image -->
        <img
          width="80"
          height="80"
          style="
            border-radius: 12px;
            background:
              linear-gradient(45deg, #a361f4, transparent),
              linear-gradient(-45deg, #519ae7, transparent),
              linear-gradient(90deg, #7daeb1, transparent),
              linear-gradient(0deg, #7028d6, #023047);
          "
        />
        <div class="quiz-card-desc">
          <p class="quiz-card-desc-title">Pineapple</p>
          <div>
            <p><span>Fruits</span> • <span>Hard</span></p>
            <p>Take this quiz about pineapples</p>
          </div>
        </div>
      </button>
    </section>
  </body>
</html>

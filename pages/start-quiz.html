<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Test your knowledge with Team 5 Quiz App. Play quizzes across categories and difficulty levels, check the scoreboard, or replay past quizzes."
    />

    <link rel="stylesheet" href="../style/base.css" />
    <link rel="stylesheet" href="../style/style-start-quiz.css" />

    <!-- FONTAWSOME ICONS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script type="module" src="../script/start-quiz.js"></script>
    <title>Start Quiz</title>
  </head>
  <body>
    <header class="page-bar">
      <nav class="quiz-nav">
        <a
          href="./categories.html"
          class="page-bar__back"
          aria-label="Back to categories"
        >
          <span aria-hidden="true"
            ><i class="fa-solid fa-arrow-left-long"></i
          ></span>
        </a>
        <span>Back to categories</span>
      </nav>
    </header>

    <section id="hero">
      <img src="https://placehold.co/600x200?text=image" alt="" />
      <span class="hero-overlay" aria-hidden="true"></span>
      <!-- placeholder image (decorative: the title beside it says what it is) -->

      <div class="card-title">
        <h1 class="quiz-name">Loading quiz…</h1>
        <p class="quiz-subtext"></p>
        <span class="quiz-difficulty"
          ><i class="fa-regular fa-face-smile" aria-hidden="true"></i
        ></span>
      </div>
    </section>

    <div id="quiz-title">
      <a href="./quiz-game.html" class="boton-elegante quiz-start-link">
        <i class="fa-solid fa-play" aria-hidden="true"></i> Start quiz
      </a>
      <p class="quiz-error" role="alert" hidden></p>
    </div>

    <div id="quiz-start-container">
      <button class="quiz-start-card" type="button" aria-pressed="false">
        <!-- placeholder image -->
        <img
          width="80"
          height="80"
          src="https://placehold.co/80x80?text=image"
          alt=""
        />
        <span class="quiz-card-desc">
          <span class="quiz-card-desc-title">Pineapple</span>
          <br />
          <span>
            <span class="quiz-card-meta"
              ><span>Fruits</span> • <span>Hard</span></span
            ><br />
            <span class="quiz-card-text">Take this quiz about pineapples</span>
          </span>
        </span>
      </button>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style/base.css" />
    <link rel="stylesheet" href="style/style-index.css" />

    <!-- FONTAWSOME ICONS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script type="module" src="/script/random-quiz.js"></script>
    <title>Quiz Game</title>
  </head>
  <body>
    <header class="page-bar"></header>
    <section class="index-hero" aria-labelledby="hero-title">
      <div class="index-hero__content">
        <h2 id="hero-title">Welcome to team 5 Quiz App</h2>
        <p>Test your knowledge across categories and difficulties.</p>
        <button type="button" class="index-hero__cta" id="random-quiz">
          <i class="fa-solid fa-shuffle"></i> Play a random quiz
        </button>
      </div>
    </section>

    <h1>Dashboard</h1>
    <!-- Mobile-only random quiz button -->
    <button type="button" class="random-quiz-mobile random-quiz">
      <i class="fa-solid fa-shuffle"></i> Play a random quiz
    </button>

    <nav>
      <ul>
        <li>
          <i class="fa-regular fa-folder"></i>
          <a href="/pages/categories.html">
            <div>
              <p class="quiz-title">Quizzes</p>
              <p>Choose between different categories</p>
            </div>
          </a>
        </li>
        <li>
          <i class="fa-regular fa-star"></i>
          <a href="/pages/scoreboard.html">
            <div>
              <p class="quiz-title">Scoreboard</p>
              <p>Check the Scoreboard to see the rankings</p>
            </div>
          </a>
        </li>
        <li>
          <i class="fa-solid fa-rotate-left"></i>
          <a href="/pages/previous.html">
            <div>
              <p class="quiz-title">Previous Quizzes</p>
              <p>Replay quizzes you already played</p>
            </div>
          </a>
        </li>
      </ul>
    </nav>
  </body>
</html>
